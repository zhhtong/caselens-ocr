name: Bug report
description: Report a reproducible application, installation, or export problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve CaseLens OCR. Remove patient data, credentials, confidential protocols, proprietary files, and other sensitive information before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What went wrong?
      placeholder: A concise description of the problem.
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation mode
      options:
        - Windows v1.0.0 release
        - Python source checkout
        - Other
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CaseLens OCR version or commit
      placeholder: v1.0.0 or a commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that reproduces the problem.
      placeholder: |
        1. Start the application...
        2. Use a synthetic PDF with...
        3. Click...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste relevant logs after removing personal, confidential, and identifying information.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm this report contains no patient or participant data, credentials, confidential protocols, proprietary files, or other sensitive information.
          required: true
